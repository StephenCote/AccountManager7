# FLUX Kontext checkpoint for compositeMode=kontext. NOT installed on the local (GTR9) Swarm as of
# 2026-08-10 - the schema default flux1Kontext_flux1KontextDev is refused there with
# "Invalid model value for param Model". Leave blank to fall back to the schema default; TestKontext
