test.swarm.kontextModel=

# ---- LiteLLM proxy + Langfuse test stack (docker-compose.test.yml, profile `llmproxy`) ----
# Objects7 JUnit runs on the WINDOWS HOST, so these must be the published HOST ports
# (127.0.0.1:4000 / 127.0.0.1:3001). `http://litellm:4000` only resolves INSIDE the compose
# network and is what the Service7 container would use - do not copy that form here.
# Bring the stack up with:
#   cd src && docker compose -p am7test -f docker-compose.test.yml \
#     --env-file ./volatile/llmproxy.env --profile llmproxy up -d
# Tests gate on reachability AND on the LITELLM_LIVE env flag, so leaving these set is safe:
# with the profile down (or the flag unset) they report Skipped, never failed.
test.llm.litellm.server=http://127.0.0.1:4000
test.langfuse.host=http://127.0.0.1:3001
# Proxied model ALIAS as declared in src/litellm/config.yaml `model_list`. `qwen3:8b` maps to
# ollama_chat/qwen3:8b on OLLAMA_API_BASE and is the alias that actually works in this stack.
# The other alias, `gpt-5.6-terra`, is Azure-backed and needs AZURE_API_KEY/AZURE_API_BASE, which
# are NOT available - point this at that alias only when real Azure credentials are supplied.
test.llm.litellm.model=qwen3:8b
# Direct (non-proxied) Ollama base URL for the control case in TestLiteLLMOllamaProxy. Deliberately
# a property and NOT test.llm.ollama.server, so the control can point at a different box from the one
# under test. Defaults to the host Ollama, which serves the same qwen3:8b. (The LAN Spark at
# 192.168.1.42 was transiently wedged on 2026-09-14 and has since been bounced - healthy now, not a
# standing property of that box.)
test.llm.ollama.direct.server=http://localhost:11434
