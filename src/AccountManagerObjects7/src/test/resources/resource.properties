test.llm.type=ollama
test.llm.serviceType=ollama
test.llm.ollama.model=qwen3:8b
# ---- LLM route resolution (LlmTestGate, run once per JVM from BaseTest.setup) ----
# Tiers are tried in order: LOCAL (the test-stack Ollama container below, when /api/tags lists BOTH
# test.llm.ollama.model and test.llm.pb.model) -> AZURE (only via LiteLLM, only when LITELLM_LIVE is
# set and GET {litellm}/health?model=<azure alias> is healthy) -> REMOTE (test.llm.ollama.server, the
# Spark). Route is LiteLLM (test.llm.litellm.server, dialect openai_compat, apiKey = LITELLM_MASTER_KEY
# or sk-am7-litellm-test) whenever /health/liveliness answers, so requests are traceable in Langfuse;
# otherwise direct Ollama. The gate WRITES BACK into this Properties object: test.llm.route,
# test.llm.resolvedTier, test.llm.ollama.server (the resolved DIRECT Ollama URL), test.llm.connection.*
# (server/dialect/upstream/apiKey), test.llm.model.analysis and test.llm.model.pb (LiteLLM aliases on
# the litellm route, raw names on direct). Look for one INFO line per JVM:
#   [LLM-GATE] route=litellm tier=local analysis=qwen3:8b-ctr pb=qwen3:8b-jos-ctr server=http://127.0.0.1:4000
# Setting -Dtest.llm.ollama.server=<url> on the command line bypasses probing and pins route=direct.
# Test-stack Ollama container (docker-compose.test.yml service `ollama`, host port 11435), pulls
# nomic-embed-text, qwen3:8b and goekdenizguelmez/JOSIEFIED-Qwen3:8b on first boot.
test.llm.ollama.local.server=http://127.0.0.1:11435
# Picture-book / ChapBook model (uncensored Qwen3 8B). Analysis/summarization stays on test.llm.ollama.model.
test.llm.pb.model=goekdenizguelmez/JOSIEFIED-Qwen3:8b
# Azure alias in src/litellm/config.yaml. Only tried on the LiteLLM route; blank disables the Azure tier.
test.llm.litellm.azure.model=gpt-5.6-terra
# REMOTE tier. REPOINTED 2026-08-16 to the canonical LLM host (the Spark, 192.168.1.42). It read
# http://localhost:11434 and a SECOND local ollama answers there holding an identical-digest qwen3:8b
# (500a1f067a9f), so every LLM test silently ran on the wrong box and passed. Safe swap, measured:
# /api/tags on both hosts lists qwen3:8b with the same digest. Note way-local:latest does NOT match
# across the two (local 2a206f419e0a vs .42 0b9f7fe5fd0e) - do not assume any other model is identical.
test.llm.ollama.server=http://192.168.1.42:11434
test.llm.openai.model=
test.llm.openai.server=
test.llm.openai.version=
# KEEP BLANK (KI-11). Every *.authorizationToken key is filled at test setup by SecretTestGate from
# -D<key>, env AM7_TEST_LLM_OPENAI_AUTHORIZATIONTOKEN (etc.), or the gitignored resource.local.properties
# in this directory. TestSecretTestGate fails the build if a token is non-blank here.
test.llm.openai.authorizationToken=
test.llm.defaultModel=qwen3:8b

