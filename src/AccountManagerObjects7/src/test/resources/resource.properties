db.schema.dropColumns=false
# PostgreSQL Connection
# Port 15432 = the local dev pgvector container, which is where am7db actually lives.
# Was 15430 until 2026-09-23: the SAME stale port from a different machine's setup that was
# corrected in AccountManagerService7 and AccountManagerISO42001 on 2026-09-09 but never applied
# here, so every Objects7 test failed at BaseTest with "Connection to localhost:15430 refused" -
# which reads like a broken test rather than a config error. Verified on this machine: the dev
# container `postgres` (pgvector/pgvector:0.8.2-pg18-trixie) publishes 15432 ONLY, and am7db is
# present on it. Database name unchanged.
test.db.url=jdbc:postgresql://localhost:15432/am7db
test.db.user=am7user
test.db.password=password

test.voice.tts.server=http://192.168.1.42:8001
# STT is intentionally NOT running as of 2026-08-07: it needs a larger in-memory model than the other
# python services, and the OS/browser speech API is being used instead for now. The URL stays pointed
# at the Spark (where all the python services live) so re-enabling it is just starting the service -
# a probe of :8002 returning nothing is EXPECTED, not a misconfiguration.
test.voice.stt.server=http://192.168.1.42:8002
test.voice.type=local
test.voice.authorizationToken=

test.embedding.server=http://192.168.1.42:8123
test.embedding.type=local
test.embedding.authorizationToken=
# Embedding model name sent on the request (openai_compat only; LOCAL ignores it). Blank = leave
# EmbeddingUtil's default alone, which keeps the .42:8123 LOCAL embedder above. To embed with the
# test-stack Ollama container (nomic-embed-text, docker-compose.test.yml service `ollama`) use:
#   test.embedding.server=http://127.0.0.1:11435/v1/embeddings
#   test.embedding.type=openai_compat
#   test.embedding.model=nomic-embed-text
# NOTE: the vector column is one fixed width and stored vectors carry no model provenance, so
# repointing the embedder invalidates existing vectors in that database (architecture.md).
test.embedding.model=

# Opportunistic Ollama model unload before GPU-heavy (SD) work. OFF by default: with a large model
# (gpt-oss:120b) the reload it forces on the next LLM call costs more than the freed VRAM saves, and
# the picture-book tests alternate LLM and SD work repeatedly. Explicitly instructed and shutdown
# unloads (OllamaModelUtil.unloadAll(true)) are NOT affected by this switch.
llm.ollama.unload=false

# Shared HTTP read timeout in seconds. Must exceed the slowest legitimate SD generation: a FLUX.2
# multi-reference composite is ~638s on the local Strix Halo iGPU, and the previous hardcoded 360s
# killed every one with SocketTimeoutException while the GPU was still working.
http.read.timeout=1200

# Swarm runs on two LAN boxes: 192.168.1.39 (GTR9) and 192.168.1.42 (Spark). Prefer .39 - .42 also
# carries the Ollama traffic (Stephen, 2026-09-28). When working off the LAN the live SD tests SKIP
# visibly via SdTestGate.requireSwarmReachable rather than fail on a refused connect.
test.swarm.server=http://192.168.1.39:7801
# FLUX.2 checkpoint for the multi-reference scene composite (compositeMode=flux2). Leave blank to
# fall back to the olio.sd.config schema default. Both flux2Klein_9b and flux2_dev ARE installed on
# the local (GTR9) Swarm as of 2026-08-07 - only flux2Klein_9b exists on the Spark. Klein 9b is the
# smaller/faster of the two; flux2_dev is available locally if you want to compare quality.
test.swarm.flux2Model=flux2Klein_9b
# Base checkpoint is NOT pinned here: checkpoint inventory is per-node, so a pinned name is wrong on
# one of the two boxes. SdTestGate.resolveInstalledCheckpoints reads the node's /API/ListModels once
# per JVM and writes the result back into this property: the olio.sd.config schema default (SDXL
# base) when the node has it, else the first installed SDXL-family checkpoint. Set a value here only
# to force a specific installed checkpoint; a value the node does not list is ignored with a warning.
test.swarm.model=
# Optional refiner. Kept only when the node lists it; otherwise removed so no request names a
# checkpoint the node would refuse.
test.swarm.refinerModel=juggernautXL_ragnarokBy
