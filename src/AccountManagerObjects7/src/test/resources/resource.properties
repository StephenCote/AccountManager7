# Reset Schema
test.db.reset=false
# Drop orphaned columns during schema check (off by default; Stephen flips deliberately to clean up removed fields)
db.schema.dropColumns=false
# PostgreSQL Connection
test.db.url=jdbc:postgresql://localhost:15432/am7db
test.db.user=am7user
test.db.password=password

test.voice.tts.server=http://192.168.1.42:8001
# STT is intentionally NOT running as of 2026-08-07: it needs a larger in-memory model than the other
# python services, and the OS/browser speech API is being used instead for now. The URL stays pointed
# at the Spark (where all the python services live) so re-enabling it is just starting the service -
# a probe of :8002 returning nothing is EXPECTED, not a misconfiguration.
test.voice.stt.server=http://192.168.1.42:8002
test.voice.type=local
test.voice.authorizationToken=

test.embedding.server=http://192.168.1.42:8123
test.embedding.type=local
test.embedding.authorizationToken=

# Opportunistic Ollama model unload before GPU-heavy (SD) work. OFF by default: with a large model
# (gpt-oss:120b) the reload it forces on the next LLM call costs more than the freed VRAM saves, and
# the picture-book tests alternate LLM and SD work repeatedly. Explicitly instructed and shutdown
# unloads (OllamaModelUtil.unloadAll(true)) are NOT affected by this switch.
llm.ollama.unload=false

# PictureBook 2 graph recording. OFF by default and that default is load-bearing:
# TestPictureBookCustom#TestPictureBookCustomPipeline is the phase-3 non-regression gate BECAUSE it
# runs with this off and is never edited. TestPictureBookWorkflow turns it on for itself in setUp and
# restores it in tearDown, so flipping this line is not needed to run the v2 suite - only to make the
# whole JVM record graphs.
picturebook.v2=false

# Shared HTTP read timeout in seconds. Must exceed the slowest legitimate SD generation: a FLUX.2
# multi-reference composite is ~638s on the local Strix Halo iGPU, and the previous hardcoded 360s
# killed every one with SocketTimeoutException while the GPU was still working.
http.read.timeout=1200

test.swarm.server=http://localhost:7801
# FLUX.2 checkpoint for the multi-reference scene composite (compositeMode=flux2). Leave blank to
# fall back to the olio.sd.config schema default. Both flux2Klein_9b and flux2_dev ARE installed on
# the local (GTR9) Swarm as of 2026-08-07 - only flux2Klein_9b exists on the Spark. Klein 9b is the
# smaller/faster of the two; flux2_dev is available locally if you want to compare quality.
test.swarm.flux2Model=flux2Klein_9b
test.swarm.model=OfficialStableDiffusion/sd_xl_base_1.0
test.swarm.refinerModel=juggernautXL_ragnarokBy
test.swarm.prompt=4k HD high resolution realistic photograph of a (white) (irish) (woman)) with (red hair) in a futuristic alien city
test.swarm.negativePrompt=Washed out colors, illogical, disgusting, dumb, illogical, bad anatomy, errors, glitches, mistakes, horrid, low resolution, pixilated, cartoon, drawing, blurry, out of focus, low res, mutated, distorted, melting, cropped, disproportionate, wonky, low quality, compressed, muddy colors, overexposed, censored, mosaic, rotten, fake, plastic smooth skin, low poly, lacking detail, watermark, malformed, failed, failure, extra fingers, anime, cloned face, missing legs, extra arms, fused fingers, too many fingers, poorly drawn face.

test.llm.type=ollama
test.llm.serviceType=ollama
test.llm.ollama.model=qwen3:8b
# REPOINTED 2026-08-16 to the canonical LLM host (the Spark, 192.168.1.42). It read
# http://localhost:11434 and a SECOND local ollama answers there holding an identical-digest qwen3:8b
# (500a1f067a9f), so every LLM test silently ran on the wrong box and passed. Safe swap, measured:
# /api/tags on both hosts lists qwen3:8b with the same digest. Note way-local:latest does NOT match
# across the two (local 2a206f419e0a vs .42 0b9f7fe5fd0e) - do not assume any other model is identical.
test.llm.ollama.server=http://192.168.1.42:11434
test.llm.openai.model=
test.llm.openai.server=
test.llm.openai.version=
test.llm.openai.authorizationToken=
