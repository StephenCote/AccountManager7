# Agent7 has no LlmTestGate: its tests read the three direct keys above/below as-is. Point them at the
# test-stack Ollama container (am7-docker-up --ollama, host :11435), which serves qwen3:8b; 11434 is
# left for a host-installed Ollama. The tiering keys below are documentation parity with Objects7.
test.llm.ollama.server=http://127.0.0.1:11435
test.llm.ollama.model=qwen3:8b
# LLM tiering (mirrors Objects7 test resource.properties; see LlmTestGate there): local test-stack
# Ollama container first, then Azure via LiteLLM (LITELLM_LIVE only), then test.llm.ollama.server.
test.llm.ollama.local.server=http://127.0.0.1:11435
test.llm.pb.model=goekdenizguelmez/JOSIEFIED-Qwen3:8b
test.llm.litellm.server=http://127.0.0.1:4000
test.llm.litellm.azure.model=gpt-5.6-terra
