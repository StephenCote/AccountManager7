test.data.path=C:/Users/scote/Pictures
test.datagen.path=C:/Projects/data

# Reset Schema (one-shot; BaseTest auto-clears it). Committed default MUST stay false.
# NEVER drop/recreate the docker postgres container; NEVER TRUNCATE/DROP/DELETE directly.
test.db.reset=false
# Drop orphaned columns during schema check (off by default)
db.schema.dropColumns=false
# PostgreSQL Connection
# Dedicated ISO 42001 test database (option #2, 2026-06-22): ISO owns every org from a blank DB,
# isolated from Objects7's am7db dev keys/data; keystores are module-local (./am7). Same creds.
# Port 15432 = the local dev pgvector container (same one Objects7's am7db lives in).
# Was 15430 until 2026-09-09: a stale port carried over from a different machine's
# setup, so every ISO/Service7 test failed to connect while looking like a test defect.
# The DATABASE stays separate (am7isotestdb, owned by am7user) -- only the port moved,
# so the isolation from am7db described above is unchanged.
test.db.url=jdbc:postgresql://localhost:15432/am7isotestdb
test.db.user=am7user
test.db.password=password

test.voice.tts.server=http://localhost:8001
test.voice.stt.server=http://localhost:8002
test.voice.type=local
test.voice.authorizationToken=

test.embedding.server=http://localhost:8123
test.embedding.type=local
test.embedding.authorizationToken=

# LLM endpoint — DGX Spark (single-threaded Ollama).
test.llm.type=ollama
test.llm.serviceType=ollama
test.llm.ollama.model=qwen3:8b
test.llm.ollama.server=http://192.168.1.42:11434
test.llm.openai.model=
test.llm.openai.server=
test.llm.openai.version=
test.llm.openai.authorizationToken=
test.llm.defaultModel=qwen3:8b
