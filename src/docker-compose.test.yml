# Self-contained TEST stack: Service7 + Ux752 (am7) + a DEDICATED pgvector
# container (am7-pg), on a private network with their own volumes and
# non-colliding host ports. Nothing here touches the dev `postgres` container
# or a locally-run Tomcat.
#
#   Local Tomcat owns host 8443  -> this app publishes on host 9443
#   Dev postgres owns host 15432 -> am7-pg publishes on host 15433 (inspect-only;
#                                   the app reaches am7-pg internally on 5432)
#
# ALL persistent state (Postgres data, app keystores/vault/datagen/streams, and the shared TLS
# pair) is bind-mounted to a concrete HOST directory — AM7_DATA_DIR, default ./docker-data
# (relative to this file). This is deliberate: without a host mapping the data lives only in the
# container's writable layer and is ENTIRELY EPHEMERAL (lost on recreate). Bind mounts make it
# durable and inspectable, and keep the DB + keystores a matched pair with the same lifecycle.
#
# Usage (explicit project name keeps its network separate from the main compose project):
#   docker compose -p am7test -f docker-compose.test.yml up --build
#   docker compose -p am7test -f docker-compose.test.yml down          # stop; data kept on host
#   # full reset: stop, then delete the host data dir (there are no named volumes to prune):
#   docker compose -p am7test -f docker-compose.test.yml down; rm -rf ./docker-data
#   # to persist elsewhere: AM7_DATA_DIR=/abs/path docker compose -p am7test -f docker-compose.test.yml up --build

services:
  am7-pg:
    image: pgvector/pgvector:pg17
    container_name: am7-pg
    environment:
      POSTGRES_DB: am72db
      POSTGRES_USER: am7user
      POSTGRES_PASSWORD: password
    ports:
      # Inspect-only from the host (pgAdmin/psql). NOT used by the app, which
      # reaches am7-pg on the internal network. Avoids the dev 15432.
      - "15433:5432"
    volumes:
      # Persistent host location for the DB (see AM7_DATA_DIR above). If Postgres fails to
      # initialize on a Windows bind mount (rare on Docker Desktop/WSL2, possible on older setups),
      # swap this one line for a named volume — `- am7-test-pg:/var/lib/postgresql/data` — and
      # re-add a top-level `volumes:\n  am7-test-pg:` block at the end of this file.
      - ${AM7_DATA_DIR:-./docker-data}/pg:/var/lib/postgresql/data
    networks:
      - am7-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U am7user -d am72db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  am7:
    build:
      context: .
      dockerfile: Dockerfile
    image: am7:latest
    depends_on:
      am7-pg:
        condition: service_healthy
    ports:
      # Host 9443 -> nginx 8443 in the container. Avoids the local Tomcat's 8443.
      - "9443:8443"
    environment:
      # Reach the dedicated pg over the private compose network by service name,
      # on its INTERNAL port (not the published 15433).
      DB_HOST: am7-pg
      DB_PORT: 5432
      DB_NAME: am72db
      DB_USER: am7user
      DB_PASSWORD: password

      TASK_SERVER: ${TASK_SERVER:-https://localhost:9443/AccountManagerService7}
      SD_SERVER: ${SD_SERVER:-http://192.168.1.39:7801}
      FACE_SERVER: ${FACE_SERVER:-http://192.168.1.42:8003}
      TAG_SERVER: ${TAG_SERVER:-http://192.168.1.42:8000}
      VOICE_TTS_SERVER: ${VOICE_TTS_SERVER:-http://192.168.1.42:8001}
      VOICE_STT_SERVER: ${VOICE_STT_SERVER:-http://192.168.1.42:8002}
      EMBEDDING_SERVER: ${EMBEDDING_SERVER:-http://192.168.1.42:8123}
      # Same-origin (UI + REST both behind nginx on :9443). Include 127.0.0.1:9443
      # because Playwright on Windows must use 127.0.0.1 (localhost resolves to IPv6
      # ::1 and the TLS handshake fails). Chrome 103+ sends Origin on same-origin
      # POST requests, so 127.0.0.1:9443 must be in the allowed list or CorsFilter
      # returns 403 for all POST /rest/model/search calls.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:9443,http://localhost:9443,https://127.0.0.1:9443,http://127.0.0.1:9443,http://localhost:8899,https://localhost:8899}
    volumes:
      # Persistent host location (see AM7_DATA_DIR above): app keystores/vault/datagen/streams
      # (/data/am7) + the self-signed TLS pair nginx and Tomcat share (/etc/am7/certs). Losing
      # /data/am7 while keeping the DB orphans every org ("Failed to initialize key stores"), which
      # is exactly why both live under the same host dir with the same lifecycle.
      - ${AM7_DATA_DIR:-./docker-data}/am7:/data/am7
      - ${AM7_DATA_DIR:-./docker-data}/certs:/etc/am7/certs
    networks:
      - am7-test-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OPTIONAL LLM-proxy sidecars (compose profile `llmproxy`).
  #
  #   docker compose -p am7test -f docker-compose.test.yml --profile llmproxy up --build
  #
  # None of these start in the default stack. They implement the LiteLLM /
  # Langfuse "Tier A" path from src/aiDocs/LiteLLMLangfuseIntegrationDesign.md:
  #   AM7  --(OPENAI_COMPAT, http://litellm:4000/v1/chat/completions)-->  litellm
  #   litellm  --(azure/gpt-5.6-terra)-->  Azure   (+ Langfuse trace callback)
  #
  # WHY this is reachable from Docker: the upstream is AZURE, a public cloud
  # endpoint, so the compose network routes to it fine. The "Docker can't reach
  # the LAN" rule (.claude/rules/troubleshooting.md) only bites LAN hosts like
  # the SD server at 192.168.1.39 — it does NOT apply to Azure.
  #
  # SECRETS: the upstream Azure key is NEVER committed. Provide it at runtime,
  # e.g. an --env-file pointing at a git-ignored volatile path:
  #   docker compose -p am7test -f docker-compose.test.yml \
  #     --env-file ./volatile/llmproxy.env --profile llmproxy up
  # where volatile/llmproxy.env sets AZURE_API_KEY=... (volatile* is gitignored).
  # The Langfuse key defaults below are throwaway test-only placeholders and are
  # seeded into Langfuse headlessly via LANGFUSE_INIT_* so LiteLLM can wire up
  # front with no manual UI bootstrap.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["llmproxy"]
    depends_on:
      langfuse:
        condition: service_started
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Inspect-only from the host. The app reaches litellm by service name.
      - "4000:4000"
    environment:
      # Upstream Azure — key MUST come from the environment/secret, never committed.
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-https://ai-serv-ccok-edw-dev-001.openai.azure.com}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2025-04-01-preview}
      # Proxy's own client-facing key (AM7 sends this as its Bearer token).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-am7-litellm-test}
      # Tier A callback target.
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-am7-test}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-am7-test}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - am7-test-net
    restart: unless-stopped

  langfuse:
    # v2 needs only Postgres (v3 pulls in Clickhouse/Redis/S3 — too heavy for a
    # test sidecar). Receives traces over the compose network; needs no LAN.
    image: langfuse/langfuse:2
    profiles: ["llmproxy"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # Langfuse UI on the host (avoids app ports). Login via LANGFUSE_INIT_USER_*.
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-am7-langfuse-nextauth-test}
      SALT: ${LANGFUSE_SALT:-am7-langfuse-salt-test}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: am7
      LANGFUSE_INIT_ORG_NAME: AM7
      LANGFUSE_INIT_PROJECT_ID: am7-test
      LANGFUSE_INIT_PROJECT_NAME: AM7 Test
      # Deterministic keys so LiteLLM (above) is wired up front — test-only, safe to commit.
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-am7-test}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-am7-test}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-am7@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-AM7 Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-am7-langfuse-pw-test}
    networks:
      - am7-test-net
    restart: unless-stopped

  langfuse-db:
    # Dedicated Postgres for Langfuse — separate from am7-pg (different app DB).
    image: postgres:17
    profiles: ["llmproxy"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ${AM7_DATA_DIR:-./docker-data}/langfuse-pg:/var/lib/postgresql/data
    networks:
      - am7-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  am7-test-net:
