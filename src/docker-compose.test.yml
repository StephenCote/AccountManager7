# Self-contained TEST stack: Service7 + Ux752 (am7) + a DEDICATED pgvector
# container (am7-pg), on a private network with their own volumes and
# non-colliding host ports. Nothing here touches the dev `postgres` container
# or a locally-run Tomcat.
#
#   Local Tomcat owns host 8443  -> this app publishes on host 9443
#   Dev postgres owns host 15432 -> am7-pg publishes on host 15433 (inspect-only;
#                                   the app reaches am7-pg internally on 5432)
#
# ALL persistent state (Postgres data, app keystores/vault/datagen/streams, and the shared TLS
# pair) is bind-mounted to a concrete HOST directory — AM7_DATA_DIR, default ./docker-data
# (relative to this file). This is deliberate: without a host mapping the data lives only in the
# container's writable layer and is ENTIRELY EPHEMERAL (lost on recreate). Bind mounts make it
# durable and inspectable, and keep the DB + keystores a matched pair with the same lifecycle.
#
# Usage (explicit project name keeps its network separate from the main compose project):
#   docker compose -p am7test -f docker-compose.test.yml up --build
#   docker compose -p am7test -f docker-compose.test.yml down          # stop; data kept on host
#   # full reset: stop, then delete the host data dir (there are no NAMED volumes):
#   docker compose -p am7test -f docker-compose.test.yml down; rm -rf ./docker-data
#   # ...but ANONYMOUS ones do accrue since the pg18 bump: the pg18 base declares
#   # VOLUME /var/lib/postgresql (the PARENT of our bind), where pg17 declared the
#   # bind path itself. Each am7-pg container therefore carries one anonymous
#   # volume holding nothing but the mountpoint stub — no data risk, but one leaks
#   # per down/up cycle. Sweep occasionally with `docker volume prune`.
#   # to persist elsewhere: AM7_DATA_DIR=/abs/path docker compose -p am7test -f docker-compose.test.yml up --build
#
# POSTGRES TUNING. am7-pg is BUILT (docker/postgres/Dockerfile), not pulled stock:
# the memory / large-complex-query settings are baked into the image and can be
# overridden three ways, lowest precedence first —
#   1. build ARGs      docker compose ... build --build-arg PG_WORK_MEM=1GB am7-pg
#   2. runtime conf.d  drop a *.conf in docker/postgres/conf.d + pg_reload_conf()
#                      (no rebuild, no restart, for non-postmaster settings)
#   3. ALTER SYSTEM    parsed after conf.d, so it silently OUTRANKS it
#   4. command flags   postgres -c work_mem=32MB   (beats everything)
# A conf.d override that "doesn't take" is usually tier 3 -- check with
#   select name, setting, source, sourcefile from pg_settings where name = '...';
# Every ARG is surfaced as ${VAR:-default} below, so the environment and
# am7-docker-up.bat can set them too. Details: docker/postgres/conf.d/README.md.
#
# PG MAJOR VERSION IS COUPLED TO THE DATA DIRECTORY. A cluster initialized by
# one major will NOT start under another ("database files are incompatible").
# Changing PG_IMAGE across majors therefore requires deleting
# ${AM7_DATA_DIR}/pg — and ${AM7_DATA_DIR}/am7 WITH it, per the matched-pair
# rule above — then redoing first-run setup. Within a major (e.g. a pgvector
# patch bump) a plain rebuild is safe and keeps the data.

services:
  am7-pg:
    # Built from docker/postgres/Dockerfile rather than consumed stock: the AM7
    # performance tuning is BAKED INTO THE IMAGE at build time (see that file and
    # docker/postgres/am7-tuning.conf.template for the values and the reasoning).
    # Overridable at three levels — build ARGs below, a runtime *.conf dropped in
    # docker/postgres/conf.d (reloadable, no rebuild), and `-c` flags on `command:`.
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
      args:
        # FULLY pinned on purpose. An unpinned `pgvector/pgvector` in
        # setup/dockerNotes.txt is what silently floated the dev container to a
        # new PG major while this file sat on pg17 — the drift this replaces.
        PG_IMAGE: ${PG_IMAGE:-pgvector/pgvector:0.8.6-pg18-trixie}
        # Sized for the measured ~31.16 GiB Docker VM shared with the dev
        # `postgres` container and Tomcat's -Xmx8g. Dial down for a smaller
        # machine, e.g. PG_SHARED_BUFFERS=512MB PG_WORK_MEM=16MB docker compose ... build
        #
        # These duplicate the ARG defaults in docker/postgres/Dockerfile and,
        # because they are passed explicitly, they WIN over them on every
        # compose build. The Dockerfile copy only applies to a bare
        # `docker build`. Keep the two in step.
        #
        # THIRD drift channel to know about: compose auto-loads src/.env, so a
        # PG_* set there silently overrides these defaults with nothing in the
        # compose file or the image to show it. Same invisibility as a
        # git-ignored docker/postgres/conf.d/*.conf. If a value looks wrong,
        # check src/.env before the build args.
        PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-2GB}
        PG_WORK_MEM: ${PG_WORK_MEM:-128MB}
        PG_MAINTENANCE_WORK_MEM: ${PG_MAINTENANCE_WORK_MEM:-512MB}
        PG_AUTOVACUUM_WORK_MEM: ${PG_AUTOVACUUM_WORK_MEM:-256MB}
        PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-8GB}
        PG_RANDOM_PAGE_COST: ${PG_RANDOM_PAGE_COST:-1.1}
        PG_MAX_PARALLEL_WORKERS_PER_GATHER: ${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
        PG_MAX_PARALLEL_MAINTENANCE_WORKERS: ${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-2}
        PG_MAX_PARALLEL_WORKERS: ${PG_MAX_PARALLEL_WORKERS:-8}
        PG_EFFECTIVE_IO_CONCURRENCY: ${PG_EFFECTIVE_IO_CONCURRENCY:-200}
        PG_MAINTENANCE_IO_CONCURRENCY: ${PG_MAINTENANCE_IO_CONCURRENCY:-200}
        # Must exceed the JDBC pool's maxActive="150" (context.xml.template),
        # or the pool opens past the server limit under load and gets
        # `FATAL: sorry, too many clients already`.
        PG_MAX_CONNECTIONS: ${PG_MAX_CONNECTIONS:-200}
        PG_MAX_WAL_SIZE: ${PG_MAX_WAL_SIZE:-4GB}
        PG_MIN_WAL_SIZE: ${PG_MIN_WAL_SIZE:-1GB}
        # Unquoted; the template adds the quotes. Multiple libraries are a plain
        # comma list (pg_stat_statements,auto_explain) -- do NOT quote it here.
        PG_SHARED_PRELOAD_LIBRARIES: ${PG_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}
    image: am7-pg:latest
    container_name: am7-pg
    # Parallel hash joins put their shared hash table in /dev/shm (Postgres uses
    # dynamic_shared_memory_type=posix). The Docker default is 64MB, which a big
    # parallel join blows through with
    #     ERROR: could not resize shared memory segment ... No space left on device
    # — reproduced on a 4M-row join, and fixed by raising this. Sizing: a SINGLE
    # Parallel Hash node can reach work_mem x hash_mem_multiplier(2) x
    # participants(leader + 4 workers) = 128MB x 2 x 5 = ~1.25 GiB. 2gb is ~1.6x
    # that ONE node — it is not a ceiling for the container: a query with two
    # parallel hash joins wants ~2.5 GiB and would still exceed it, and
    # concurrent queries stack. Raise this (or lower work_mem) if the resize
    # error reappears. tmpfs allocates on demand, so this is a cap and not a
    # reservation.
    # NOTE: shared_buffers does NOT come from here (it is anonymous shared mmap),
    # so the usual "raise shm for shared_buffers" advice does not apply.
    shm_size: ${PG_SHM_SIZE:-2gb}
    environment:
      POSTGRES_DB: am72db
      POSTGRES_USER: am7user
      POSTGRES_PASSWORD: password
    ports:
      # Inspect-only from the host (pgAdmin/psql). NOT used by the app, which
      # reaches am7-pg on the internal network. Avoids the dev 15432.
      - "15433:5432"
    volumes:
      # Persistent host location for the DB (see AM7_DATA_DIR above). If Postgres fails to
      # initialize on a Windows bind mount (rare on Docker Desktop/WSL2, possible on older setups),
      # swap this one line for a named volume — `- am7-test-pg:/var/lib/postgresql/data` — and
      # re-add a top-level `volumes:\n  am7-test-pg:` block at the end of this file.
      #
      # The container path is NOT arbitrary and must not be "modernised" to match
      # the pg18 base image's own PGDATA (/var/lib/postgresql/18/docker): our
      # Dockerfile pins ENV PGDATA back to this pg17-era path precisely so this
      # mount keeps working across majors. Change one without the other and
      # initdb writes OUTSIDE the mount — the database then lives in the
      # container layer and is destroyed on recreate, silently.
      - ${AM7_DATA_DIR:-./docker-data}/pg:/var/lib/postgresql/data
      # Runtime tuning overrides; read after the baked defaults, so they win
      # over them. See docker/postgres/conf.d/README.md.
      #
      # `:ro` is NOT a security control -- it only stops the container writing
      # back to your working tree. The directory is host-writable, its contents
      # are executed as full-authority server config, and `ALTER SYSTEM` still
      # outranks anything placed here. It grants no capability the read-write
      # data mount on the line above does not already grant.
      - ${AM7_PG_CONF_DIR:-./docker/postgres/conf.d}:/etc/postgresql/conf.d:ro
    networks:
      - am7-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U am7user -d am72db"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  am7:
    build:
      context: .
      dockerfile: Dockerfile
    image: am7:latest
    depends_on:
      am7-pg:
        condition: service_healthy
    ports:
      # Host 9443 -> nginx 8443 in the container. Avoids the local Tomcat's 8443.
      - "9443:8443"
    environment:
      # Reach the dedicated pg over the private compose network by service name,
      # on its INTERNAL port (not the published 15433).
      DB_HOST: am7-pg
      DB_PORT: 5432
      DB_NAME: am72db
      DB_USER: am7user
      DB_PASSWORD: password

      # Tomcat JVM options. CATALINA_OPTS rather than JAVA_OPTS on purpose: stock
      # catalina.sh applies CATALINA_OPTS only to start/run/debug, while JAVA_OPTS is also
      # handed to the `stop` command, so memory/GC flags belong here (catalina.sh's own
      # header says so). docker/setenv.sh APPENDS to JAVA_OPTS to add
      # -Djava.security.auth.login.config, so neither variable clobbers the other -- but
      # leave the JAAS setting to setenv.sh and keep this to runtime tuning.
      #
      # Without an explicit -Xmx the JVM uses ergonomics: max heap = 1/4 of the memory the
      # CONTAINER can see, measured at ~7.8 GiB on this host. That is invisible until a
      # large run hits it, so it is pinned here instead. Override per-invocation by setting
      # CATALINA_OPTS in the environment (docker/entrypoint.sh does not need to export it --
      # compose env reaches Tomcat via supervisord, verified 2026-09-07).
      CATALINA_OPTS: ${CATALINA_OPTS:--Xms1g -Xmx8g}

      TASK_SERVER: ${TASK_SERVER:-https://localhost:9443/AccountManagerService7}
      SD_SERVER: ${SD_SERVER:-http://192.168.1.39:7801}
      FACE_SERVER: ${FACE_SERVER:-http://192.168.1.42:8003}
      TAG_SERVER: ${TAG_SERVER:-http://192.168.1.42:8000}
      VOICE_TTS_SERVER: ${VOICE_TTS_SERVER:-http://192.168.1.42:8001}
      VOICE_STT_SERVER: ${VOICE_STT_SERVER:-http://192.168.1.42:8002}
      EMBEDDING_SERVER: ${EMBEDDING_SERVER:-http://192.168.1.42:8123}
      # Embedding protocol: 'local' (bundled embedApiMini.py, default) or 'openai' (Azure/OpenAI).
      EMBEDDING_TYPE: ${EMBEDDING_TYPE:-local}
      # Embedding-server auth token (OPENAI branch). A credential -- keep it out of git: leave the
      # default empty and supply the real value via a .env file or the host environment. Empty means
      # no Authorization header is sent.
      EMBEDDING_AUTH_TOKEN: ${EMBEDDING_AUTH_TOKEN:-}
      # Same-origin (UI + REST both behind nginx on :9443). Include 127.0.0.1:9443
      # because Playwright on Windows must use 127.0.0.1 (localhost resolves to IPv6
      # ::1 and the TLS handshake fails). Chrome 103+ sends Origin on same-origin
      # POST requests, so 127.0.0.1:9443 must be in the allowed list or CorsFilter
      # returns 403 for all POST /rest/model/search calls.
      # The LAN-IP origins matter as much as the loopback ones: reaching the UI by IP from
      # another machine (or from this host by IP) makes the browser send that exact Origin on
      # every POST, and CorsFilter 403s anything unlisted BEFORE the request reaches Jersey.
      # The symptom is login returning a null/empty response with NOTHING in the app log,
      # while the UI and all GETs work fine -- browsers omit Origin on same-origin navigation
      # and GET fetches, so only POSTs break. Diagnosed live 2026-09-07.
      #
      # This list REPLACES rather than extends when CORS_ALLOWED_ORIGINS is set in the
      # environment, so an env override must repeat every origin it still wants. Keeping the
      # LAN IP in the file default (not only in am7-docker-up.bat) means a plain
      # `docker compose up -d` cannot silently drop it -- which is exactly what happened
      # while adding CATALINA_OPTS above.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost:9443,http://localhost:9443,https://127.0.0.1:9443,http://127.0.0.1:9443,http://localhost:8899,https://localhost:8899,https://192.168.1.39:9443,http://192.168.1.39:9443}
    volumes:
      # Persistent host location (see AM7_DATA_DIR above): app keystores/vault/datagen/streams
      # (/data/am7) + the self-signed TLS pair nginx and Tomcat share (/etc/am7/certs). Losing
      # /data/am7 while keeping the DB orphans every org ("Failed to initialize key stores"), which
      # is exactly why both live under the same host dir with the same lifecycle.
      - ${AM7_DATA_DIR:-./docker-data}/am7:/data/am7
      - ${AM7_DATA_DIR:-./docker-data}/certs:/etc/am7/certs
    networks:
      - am7-test-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OPTIONAL LLM-proxy sidecars (compose profile `llmproxy`).
  #
  #   docker compose -p am7test -f docker-compose.test.yml --profile llmproxy up --build
  #
  # None of these start in the default stack. They implement the LiteLLM /
  # Langfuse "Tier A" path from src/aiDocs/LiteLLMLangfuseIntegrationDesign.md:
  #   AM7  --(OPENAI_COMPAT, http://litellm:4000/v1/chat/completions)-->  litellm
  #   litellm  --(azure/gpt-5.6-terra)-->  Azure   (+ Langfuse trace callback)
  #
  # WHY this is reachable from Docker: the upstream is AZURE, a public cloud
  # endpoint, so the compose network routes to it fine. The "Docker can't reach
  # the LAN" rule (.claude/rules/troubleshooting.md) only bites LAN hosts like
  # the SD server at 192.168.1.39 — it does NOT apply to Azure.
  #
  # SECRETS: the upstream Azure key is NEVER committed. Provide it at runtime,
  # e.g. an --env-file pointing at a git-ignored volatile path:
  #   docker compose -p am7test -f docker-compose.test.yml \
  #     --env-file ./volatile/llmproxy.env --profile llmproxy up
  # where volatile/llmproxy.env sets AZURE_API_KEY=... (volatile* is gitignored).
  # The Langfuse key defaults below are throwaway test-only placeholders and are
  # seeded into Langfuse headlessly via LANGFUSE_INIT_* so LiteLLM can wire up
  # front with no manual UI bootstrap.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["llmproxy"]
    depends_on:
      langfuse:
        condition: service_started
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      # Inspect-only from the host. The app reaches litellm by service name.
      - "4000:4000"
    environment:
      # Upstream Azure — key AND base host MUST come from the environment/secret, never committed
      # (supply via --env-file ./volatile/llmproxy.env). No default host in-repo.
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-2025-04-01-preview}
      # Proxy's own client-facing key (AM7 sends this as its Bearer token).
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-am7-litellm-test}
      # Tier A callback target.
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-am7-test}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-am7-test}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - am7-test-net
    restart: unless-stopped

  langfuse:
    # v2 needs only Postgres (v3 pulls in Clickhouse/Redis/S3 — too heavy for a
    # test sidecar). Receives traces over the compose network; needs no LAN.
    image: langfuse/langfuse:2
    profiles: ["llmproxy"]
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      # Langfuse UI on the host (avoids app ports). Login via LANGFUSE_INIT_USER_*.
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-am7-langfuse-nextauth-test}
      SALT: ${LANGFUSE_SALT:-am7-langfuse-salt-test}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: am7
      LANGFUSE_INIT_ORG_NAME: AM7
      LANGFUSE_INIT_PROJECT_ID: am7-test
      LANGFUSE_INIT_PROJECT_NAME: AM7 Test
      # Deterministic keys so LiteLLM (above) is wired up front — test-only, safe to commit.
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-am7-test}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-am7-test}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-am7@example.com}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-AM7 Admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-am7-langfuse-pw-test}
    networks:
      - am7-test-net
    restart: unless-stopped

  langfuse-db:
    # Dedicated Postgres for Langfuse — separate from am7-pg (different app DB).
    # Version-pinned to stay in step with am7-pg's PG major, but deliberately
    # NOT given the AM7 tuning: this store is owned by Langfuse, holds trace
    # data, and has none of the large-complex-query characteristics that tuning
    # targets. Bumping 17 -> 18 is free here because the `llmproxy` profile has
    # never been run (no ${AM7_DATA_DIR}/langfuse-pg exists to migrate).
    image: postgres:18.6-trixie
    profiles: ["llmproxy"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      # REQUIRED with the pg18 base, exactly as for am7-pg -- and easier to miss
      # here, because this service uses the stock image and so has no Dockerfile
      # to pin it. postgres:18.x ships PGDATA=/var/lib/postgresql/18/docker while
      # the bind below targets the pg17-era /var/lib/postgresql/data. Without
      # this line initdb writes OUTSIDE the bind mount, into the image's
      # anonymous volume: ${AM7_DATA_DIR}/langfuse-pg stays empty, `down`
      # orphans the volume, and the next `up` silently starts an empty Langfuse
      # DB. No error at any point.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ${AM7_DATA_DIR:-./docker-data}/langfuse-pg:/var/lib/postgresql/data
    networks:
      - am7-test-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  am7-test-net:
