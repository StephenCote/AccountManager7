[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Every program drops to the unprivileged am7 user (created in the Dockerfile, ownership handed
; over in entrypoint.sh). supervisord sets only the uid/gid when `user=` is given -- it does NOT
; reset HOME, so without the explicit environment= each child would inherit root's HOME and npm
; would try to write its cache under /root.

[program:tomcat]
command=/opt/tomcat/bin/catalina.sh run
user=am7
environment=HOME="/home/am7",USER="am7"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ux752]
command=npx vite preview --host 0.0.0.0 --port 8899
directory=/opt/ux752
user=am7
environment=HOME="/home/am7",USER="am7"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
user=am7
environment=HOME="/home/am7",USER="am7"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
