# Enabling here will attempt to create the extension when setting up the database
# DJL Configuration
# Currently only setup for PyTorch
# Any library dependencies must be in the system path - EG:
# set PYTORCH_LIBRARY_PATH=C:\Users\swcot\.djl.ai\pytorch\2.0.1-20230709-cu118-win-x86_64
# set PATH=%PYTORCH_LIBRARY_PATH%;%PATH%
test.vector.enable=true
# Opportunistic Ollama model unload before GPU-heavy (SD) work. OFF by default: with a large model
# (gpt-oss:120b) the reload it forces on the next LLM call costs more than the freed VRAM saves.
# Explicitly instructed and shutdown unloads (OllamaModelUtil.unloadAll(true)) are NOT affected.
llm.ollama.unload=false
# Fallback SD checkpoint when an olio.sd.config carries no model. Checkpoint names are per-Swarm
# install and a wrong one returns an EMPTY IMAGE LIST rather than an error, so prefer setting this
# over relying on the olio.sd.config schema default. Verified present on the local Swarm 2026-08-07
# (sdXL_v10VAEFix.safetensors is NOT - it exists only on the 192.168.1.42 server).
sd.default.model=OfficialStableDiffusion/sd_xl_base_1.0
